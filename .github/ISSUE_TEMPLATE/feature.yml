name: Feature request
description: Something wmux should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution — it often has more than one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like wmux to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
    validations:
      required: false
