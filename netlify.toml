[build]
  publish = "site/"
  command = "echo 'Static site, no build needed'"

# ============================================================================
# wmux-orchestrator (plugin.wmux.org)
# Explicit-URL rewrite: serve site/orchestrator/ under plugin.wmux.org
# Note: Netlify [redirects.conditions] does NOT support Host matching, so we
# match the host directly inside the `from` field as a full URL pattern.
# ============================================================================

# Root: plugin.wmux.org/ → serve /orchestrator/index.html (silent rewrite)
[[redirects]]
  from = "https://plugin.wmux.org/"
  to = "/orchestrator/index.html"
  status = 200
  force = true

# Everything else under plugin.wmux.org → orchestrator/:splat
[[redirects]]
  from = "https://plugin.wmux.org/*"
  to = "/orchestrator/:splat"
  status = 200
  force = true

# ============================================================================
# Cache headers — orchestrator subpath
# ============================================================================

# Other assets (favicon, logo, screenshots) — cached, but REVALIDATED.
#
# These were immutable alongside the fonts, which was wrong: `immutable` is a
# promise that the bytes at this URL will never change, and it is only safe when
# the filename carries a content hash. favicon.png and wmux_logo.png keep their
# name across brand changes, so the promise was false — a visitor who had loaded
# the old mark once would keep it for the full year without ever revalidating,
# no matter how many times the site was redeployed. The fonts above are a
# genuine immutable case (a woff2 that is replaced, not edited), so they keep it.
#
# An hour with must-revalidate costs one conditional request per asset per hour
# and returns 304 when nothing changed.
[[headers]]
  for = "/orchestrator/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Self-hosted Geist Mono woff2 — a genuine immutable case: a webfont is replaced
# under a new name, never edited in place.
# (Two patterns: /orchestrator/* matches direct hits on wmux.org/orchestrator/,
#  /assets/* matches plugin.wmux.org requests after the host rewrite — Netlify
#  evaluates headers against the incoming URL, not the rewritten file path.)
#
# Deliberately placed AFTER the broader /assets/* rules above, not before. Both
# patterns match a font URL, and rather than depend on Netlify resolving that by
# path specificity, the narrower rule is simply last — so it wins under either
# reading, most-specific-wins or last-one-wins.
[[headers]]
  for = "/orchestrator/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# CSS — short cache, must revalidate
[[headers]]
  for = "/orchestrator/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# JS — short cache, must revalidate
[[headers]]
  for = "/orchestrator/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ============================================================================
# Security headers — site-wide (applies to wmux.org and plugin.wmux.org)
# ============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
